<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Makro-Indikatoren lernen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4;--surface:#FFFFFF;--surface2:#F6F8FA;--ink:#16202E;--muted:#5A6676;--line:#D5DBE2;
  --accent:#2D4BA0;--accent-soft:#E3E9F7;--hawk:#A3312A;--hawk-soft:#F6E3E1;--dove:#1D6F72;--dove-soft:#DDF0EF;
  --ok:#1F7A3E;--ok-soft:#E0F2E6;--bad:#A3312A;--bad-soft:#F6E3E1;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F141B;--surface:#171E28;--surface2:#1C2430;--ink:#E6EAF0;--muted:#9AA6B5;--line:#2A3442;
    --accent:#8EA8F0;--accent-soft:#1F2A44;--hawk:#E58A7F;--hawk-soft:#3A1F1C;--dove:#62C4C1;--dove-soft:#14302F;
    --ok:#6FCF8E;--ok-soft:#173222;--bad:#E58A7F;--bad-soft:#3A1F1C;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141B;--surface:#171E28;--surface2:#1C2430;--ink:#E6EAF0;--muted:#9AA6B5;--line:#2A3442;
  --accent:#8EA8F0;--accent-soft:#1F2A44;--hawk:#E58A7F;--hawk-soft:#3A1F1C;--dove:#62C4C1;--dove-soft:#14302F;
  --ok:#6FCF8E;--ok-soft:#173222;--bad:#E58A7F;--bad-soft:#3A1F1C;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.55}
h1,h2,h3{font-family:"Archivo",system-ui,sans-serif;font-weight:700;line-height:1.15;margin:0}
button{font:inherit;color:inherit}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1180px;margin:0 auto;min-height:100vh}
aside{padding:28px 20px;border-right:1px solid var(--line)}
.brand h1{font-size:22px;font-stretch:85%;letter-spacing:-.01em}
.brand p{margin:6px 0 0;color:var(--muted);font-size:15px}
.overall{margin:22px 0 18px;font-size:14px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
nav{display:flex;flex-direction:column;gap:4px}
.navbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer}
.navbtn:hover{background:var(--surface2)}
.navbtn[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.navbtn .nm{font-weight:600}
.badge{font-size:13px;padding:2px 8px;border-radius:10px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.pass{background:var(--ok-soft);color:var(--ok)}
.badge.fail{background:var(--bad-soft);color:var(--bad)}
main{padding:36px 40px 80px;min-width:0}
.cat-head h2{font-size:clamp(30px,4.4vw,46px);font-stretch:80%;letter-spacing:-.02em}
.cat-head .lead{max-width:68ch;color:var(--muted);margin:12px 0 0;font-size:18px}
.chain{margin:26px 0 30px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0;max-width:72ch}
.chain h3{font-size:15px;font-stretch:90%;margin-bottom:6px;color:var(--accent)}
.chain p{margin:0}
.list{display:flex;flex-direction:column;gap:10px;max-width:820px}
details.ind{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.ind summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center}
details.ind summary::-webkit-details-marker{display:none}
.ind .t{font-family:"Archivo",sans-serif;font-weight:700;font-size:18px;font-stretch:90%}
.ind .s{grid-column:1/2;color:var(--muted);font-size:15px}
.lever{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.dir{font-size:13px;font-weight:600;padding:3px 9px;border-radius:12px;white-space:nowrap}
.dir.hawk{background:var(--hawk-soft);color:var(--hawk)}
.dir.dove{background:var(--dove-soft);color:var(--dove)}
.dir.neutral{background:var(--surface2);color:var(--muted)}
.weight{display:flex;gap:3px;align-items:center;font-size:12px;color:var(--muted)}
.weight i{width:14px;height:5px;border-radius:2px;background:var(--line);display:inline-block}
.weight i.on{background:var(--ink)}
.body{padding:0 18px 18px;border-top:1px solid var(--line)}
.body dl{margin:14px 0 0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 18px}
.body dt{font-weight:600;color:var(--muted);font-size:15px}
.body dd{margin:0}
.cta{margin:34px 0 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:820px;padding:22px;border:1px dashed var(--line);border-radius:10px}
.cta p{margin:0;flex:1 1 260px;color:var(--muted)}
.btn{padding:11px 20px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.quiz{max-width:720px}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px}
.qtext{font-family:"Archivo",sans-serif;font-weight:700;font-size:clamp(21px,2.6vw,27px);font-stretch:90%;margin:22px 0 20px;line-height:1.25}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.explain{margin-top:18px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.explain strong{display:block;margin-bottom:4px}
.explain strong.ok{color:var(--ok)}
.explain strong.no{color:var(--bad)}
.qnav{margin-top:20px;display:flex;justify-content:flex-end;gap:10px}
.result h2{font-size:clamp(28px,4vw,40px);font-stretch:80%}
.score{font-family:"Archivo",sans-serif;font-size:72px;font-weight:800;font-stretch:75%;line-height:1;margin:18px 0 6px}
.review{margin:26px 0;display:flex;flex-direction:column;gap:8px}
.review div{padding:10px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.review div.miss{border-left:4px solid var(--bad);border-radius:0}
.review div.hit{border-left:4px solid var(--ok);border-radius:0}
.cheat{margin:26px 0 0;max-width:820px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.cheat h3{font-size:17px;font-stretch:90%;margin-bottom:12px}
.cheat p{margin:12px 0 0;color:var(--muted);font-size:15px}
.tblwrap{overflow-x:auto}
.cheat table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
.cheat th,.cheat td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.cheat th:first-child,.cheat td:first-child{text-align:left;white-space:normal}
.cheat th{font-weight:600;color:var(--muted);font-size:13px}
.cheat td.up{color:var(--ok);font-weight:700}
.cheat td.dn{color:var(--bad);font-weight:700}
.legend{margin:16px 0 0;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{border-right:none;border-bottom:1px solid var(--line);padding:20px 16px 14px}
  nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .navbtn{flex:0 0 auto}
  main{padding:26px 16px 60px}
  details.ind summary{grid-template-columns:1fr}
  .lever{grid-row:auto;grid-column:1;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px}
  .body dl{grid-template-columns:1fr;gap:2px}
  .body dd{margin-bottom:10px}
}
@media (prefers-reduced-motion:reduce){.bar>span{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>Makro-Indikatoren lernen</h1>
      <p>Was die Daten aussagen und wie sie den Leitzins bewegen.</p>
    </div>
    <div class="overall"><span id="overallText"></span><div class="bar"><span id="overallBar" style="width:0"></span></div></div>
    <nav id="nav" aria-label="Kategorien"></nav>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<script>
const DATA=[
{id:"basis",name:"Grundlagen",lead:"Bevor es um einzelne Daten geht: Fast jede Marktreaktion auf Makrodaten läuft über dieselbe Kette. Daten verändern die Erwartung an den Leitzins, das bewegt Anleiherenditen, und von dort wandert die Bewegung in Währungen und Aktien. Wer diese Kette versteht, kann jede Zahl im Kalender selbst einordnen.",chainTitle:"Die Grundkette",chain:"Überraschende Daten → Markt ändert den erwarteten Zinspfad der Zentralbank → 2-jährige Renditen bewegen sich zuerst → der USD folgt über die Zinsdifferenz zu anderen Ländern → Aktien reagieren über ihre Bewertung (Abzinsung) und über die Gewinnerwartungen. Entscheidend ist immer die Veränderung der Erwartung, nicht der Leitzins selbst: Eine Zinserhöhung, die alle erwartet haben, bewegt fast nichts.",
labels:["Kurz gesagt","Der Mechanismus","Woran du es siehst","Ausnahmen und Beispiele"],
extra:'<div class="cheat"><h3>Spickzettel: typische Reaktion nach einer Überraschung</h3><div class="tblwrap"><table><thead><tr><th>Situation</th><th>2J-Rendite</th><th>USD</th><th>Aktien</th><th>Tech / Nasdaq</th><th>Gold</th></tr></thead><tbody><tr><td>Hawkish: Inflation oder Daten stärker als erwartet</td><td class="up">↑</td><td class="up">↑</td><td class="dn">↓</td><td class="dn">↓↓</td><td class="dn">↓</td></tr><tr><td>Dovish: Inflation oder Daten schwächer, keine Rezession</td><td class="dn">↓</td><td class="dn">↓</td><td class="up">↑</td><td class="up">↑↑</td><td class="up">↑</td></tr><tr><td>Rezessionsschock: Daten brechen ein</td><td class="dn">↓↓</td><td>gemischt</td><td class="dn">↓↓</td><td class="dn">↓</td><td class="up">↑</td></tr></tbody></table></div><p>Gold reagiert gegenläufig zu Renditen und Dollar: Es bringt keine Zinsen, deshalb verliert es an Reiz, wenn sichere Anleihen mehr abwerfen, und es wird für Käufer außerhalb der USA teurer, wenn der Dollar steigt. Beim Rezessionsschock ist der USD gemischt, weil zwei Kräfte gegeneinander laufen: Sinkende US-Zinsen schwächen ihn, die Flucht in den sicheren Hafen stärkt ihn.</p></div>',
items:[
{t:"Was der Leitzins eigentlich ist",s:"Der Preis für kurzfristiges Geld",m:"Der Leitzins ist der Zins, zu dem sich Banken über Nacht Geld leihen oder bei der Zentralbank anlegen. In den USA ist das die Fed Funds Rate, in der Eurozone der Einlagensatz der EZB. Die Zentralbank legt ihn direkt fest.",z:"Weil Banken sich zu diesem Satz refinanzieren, hängen alle anderen kurzfristigen Zinsen daran: Tagesgeld, Kreditkarten, variable Kredite, Geldmarktfonds. Längere Zinsen wie 10-jährige Anleihen oder Hypotheken orientieren sich am erwarteten Durchschnitt aller künftigen Leitzinsen, plus einem Aufschlag für Risiko und Inflation. Deshalb bewegt schon die Erwartung einer Änderung die Märkte, lange bevor die Zentralbank tatsächlich handelt.",l:"Märkte preisen den künftigen Leitzinspfad laufend ein. Sichtbar ist das in den Fed Funds Futures (z. B. CME FedWatch) und in der 2-jährigen Rendite, die fast nur von der Leitzinserwartung der nächsten zwei Jahre abhängt. Neue Daten verschieben diesen Pfad. Die Marktreaktion auf einen Datenpunkt ist im Grunde die Reaktion auf die veränderte Zinserwartung.",u:"Beispiel: Der CPI kommt höher als erwartet. Die Futures preisen für das Jahr statt drei nur noch zwei Zinssenkungen ein. Die 2-jährige Rendite springt um 10 Basispunkte, obwohl die Fed an diesem Tag gar nichts entschieden hat."},
{t:"Leitzins und USD",s:"Warum höhere Zinsen die Währung stärken",m:"Steigen die erwarteten US-Zinsen im Vergleich zu anderen Ländern, wird der Dollar tendenziell stärker. Fallen sie, wird er schwächer.",z:"Große Investoren wie Pensionsfonds, Versicherer, Zentralbanken und Hedgefonds suchen weltweit den besten sicheren Zins. Bringt eine US-Staatsanleihe mehr als eine deutsche, lohnt es sich, Euro in Dollar zu tauschen und in den USA anzulegen. Diese zusätzliche Nachfrage nach Dollar treibt seinen Kurs. Entscheidend ist die Zinsdifferenz: Erhöhen Fed und EZB gleich stark, ändert sich am Abstand nichts, und der Wechselkurs bewegt sich kaum. Dazu kommt der Carry Trade: Man leiht sich Geld in einer Niedrigzinswährung wie dem Yen und legt es in Dollar an, solange der Zinsvorteil das Wechselkursrisiko übersteigt. Auch das erzeugt Dollar-Nachfrage.",l:"EUR/USD folgt auffällig eng der Differenz zwischen 2-jährigen US- und deutschen Renditen. Hawkishe US-Daten → US-Renditen steigen stärker als deutsche → EUR/USD fällt, der Dollar wird stärker. Hawkishe Eurozonen-Daten wirken genau umgekehrt.",u:"Ausnahme Krise: In Panikphasen steigt der Dollar oft, selbst wenn die Fed die Zinsen senkt. Er gilt als sicherer Hafen, und weltweit müssen Dollar-Schulden bedient werden, wofür Dollar gekauft werden. Man spricht vom Dollar Smile: Der Dollar ist stark, wenn es den USA sehr gut geht (hohe Zinsen, Kapitalzuflüsse) oder der Welt sehr schlecht (Flucht in Sicherheit), und eher schwach dazwischen."},
{t:"Leitzins und Aktien",s:"Warum höhere Zinsen Aktien meist belasten",m:"Höhere Zinsen oder schon die Erwartung höherer Zinsen drücken Aktienkurse in der Regel, niedrigere stützen sie. Dabei wirken drei Kanäle gleichzeitig.",z:"1) Bewertung: Eine Aktie ist so viel wert wie alle künftigen Gewinne, abgezinst auf heute. Je höher der Zins, desto weniger ist ein Euro Gewinn in zehn Jahren heute wert, also sinkt der faire Kurs. 2) Konkurrenz: Bringt eine sichere Staatsanleihe 5 %, müssen Aktien deutlich mehr bieten, um ihr Risiko zu rechtfertigen. Geld wandert von Aktien in Anleihen und Geldmarkt, die Bewertungen (z. B. das KGV) sinken. 3) Gewinne: Unternehmen zahlen mehr Zinsen auf ihre Kredite, Kunden kaufen weniger auf Pump, Investitionen werden aufgeschoben. Das senkt mit Verzögerung die Gewinne selbst.",l:"Kurzfristig wirken vor allem Kanal 1 und 2: Steigen nach einem Datenpunkt die Renditen, fallen Aktien oft innerhalb von Minuten. Kanal 3 zeigt sich erst über Quartale in den Unternehmenszahlen.",u:"Zinssenkungen sind nicht automatisch gut für Aktien. Senkt die Fed, weil die Inflation besiegt ist und die Wirtschaft stabil bleibt (Soft Landing), steigen Aktien meist. Senkt sie, weil eine Rezession droht, brechen die Gewinne stärker ein, als der niedrigere Zins hilft, und Aktien fallen trotzdem. So war es 2001 und 2008: Die Fed senkte kräftig, die Märkte fielen weiter. Wichtig ist also immer, warum sich die Zinsen bewegen."},
{t:"Wachstum vs. Value",s:"Warum Tech-Aktien besonders zinsempfindlich sind",m:"Nicht alle Aktien reagieren gleich. Wachstumswerte wie Tech-Konzerne leiden stärker unter steigenden Zinsen als Value-Werte wie Banken, Energie oder Versorger.",z:"Bei Wachstumsunternehmen liegt ein großer Teil der erwarteten Gewinne weit in der Zukunft. Genau diese fernen Gewinne werden durch einen höheren Abzinsungssatz am stärksten entwertet, ähnlich wie eine 30-jährige Anleihe stärker auf Zinsänderungen reagiert als eine 2-jährige. Man sagt, sie haben eine lange Duration. Value-Unternehmen verdienen ihr Geld eher heute und schütten es aus, dort fällt der Zinseffekt kleiner aus. Banken können sogar profitieren, weil ihre Zinsmarge mit höheren Zinsen wachsen kann.",l:"Bei hawkishen Überraschungen fällt der Nasdaq 100 typischerweise stärker als der Dow Jones. Small Caps (Russell 2000) leiden ebenfalls stark, weil kleine Firmen mehr variabel verzinste Schulden haben und höhere Zinsen sofort spüren.",u:"2022 stieg der Leitzins der Fed von nahe 0 auf über 4 %. Der Nasdaq verlor rund ein Drittel, der Energiesektor legte im selben Jahr deutlich zu. Umgekehrt profitieren Wachstumswerte am meisten, wenn Zinssenkungen eingepreist werden."},
{t:"USD und Aktien",s:"Wie ein starker Dollar auf Aktien wirkt",m:"Ein starker Dollar ist für US-Aktien eher Gegenwind, für Exporteure in Europa und Japan eher Rückenwind. Für dich als Anleger in Euro kommt der Wechselkurs als eigener Effekt hinzu.",z:"Die Unternehmen im S&P 500 erzielen grob 40 % ihres Umsatzes im Ausland. Steigt der Dollar, sind diese Euro- oder Yen-Umsätze umgerechnet weniger Dollar wert, und US-Produkte werden im Ausland teurer. Außerdem verschärft ein starker Dollar die weltweiten Finanzierungsbedingungen: Viele Länder und Firmen haben Schulden in Dollar, die teurer zu bedienen werden. Schwellenländer-Aktien leiden darunter besonders. Umgekehrt hilft ein schwacher Euro den exportstarken DAX-Konzernen, weil ihre Waren international günstiger werden und Auslandsgewinne in Euro umgerechnet mehr wert sind.",l:"Weil Zinsen und Dollar oft gemeinsam steigen, kommen US-Aktien bei hawkishen Daten von zwei Seiten unter Druck: höhere Abzinsung und schwächere Auslandsgewinne. Achte in den Quartalsberichten großer US-Konzerne auf den Satz zu Währungseffekten (FX headwind), dort siehst du den Kanal direkt.",u:"Beispiel für Euro-Anleger: Fällt EUR/USD von 1,10 auf 1,00, ist ein US-ETF in Euro gerechnet rund 10 % mehr wert, obwohl sich der Index nicht bewegt hat. Steigt EUR/USD danach wieder, verliert man diesen Gewinn. Deshalb kann ein hawkisher US-Datenpunkt für dich weniger schlimm sein, als der Index aussieht: Die Aktie fällt, aber der Dollar steigt."},
{t:"Good news is bad news",s:"Warum starke Daten Aktien manchmal fallen lassen",m:"Je nach Marktphase reagieren Aktien auf gute Konjunkturdaten positiv oder negativ. Es kommt darauf an, was dem Markt gerade mehr Sorgen macht: Inflation oder Rezession.",z:"Ist die Inflation das Hauptproblem, bedeutet ein starker Arbeitsmarktbericht: Die Fed muss die Zinsen länger hoch halten. Der Zinseffekt überwiegt den Gewinneffekt, Aktien fallen (good news is bad news). Ist die Inflation dagegen nahe am Ziel und der Markt fürchtet eine Rezession, bedeutet derselbe Bericht: Die Wirtschaft hält, die Gewinne sind sicher. Dann steigen Aktien (good news is good news). Schlechte Daten können Aktien steigen lassen, wenn sie Zinssenkungen näher rücken, aber nur solange sie nicht nach Rezession aussehen.",l:"Vergleiche nach einem Datenpunkt, wie sich Renditen und Aktien bewegen. Gegenläufig (Renditen ↑, Aktien ↓): Der Markt handelt gerade Zinsen. Gleichläufig (beide ↑ oder beide ↓): Der Markt handelt gerade Wachstum. So erkennst du, in welcher Phase du dich befindest.",u:"2022 und 2023 fielen Aktien regelmäßig bei starken Arbeitsmarktdaten, weil die Inflation hoch war. Als die Inflation sank und Rezessionssorgen aufkamen, drehte sich das Muster: Plötzlich wurden schwache Daten mit fallenden Aktien beantwortet."}
]},
{id:"inflation",name:"Inflation",lead:"Preisdaten sind der direkteste Draht zum Leitzins. Liegt die Inflation über dem Ziel von 2 %, muss die Zentralbank bremsen.",chain:"Höhere Preise → Inflation über Ziel → Zentralbank hält Zinsen hoch oder erhöht → kurze Renditen steigen → der USD wird stärker, weil Dollar-Anlagen mehr Zins bringen als Anlagen in anderen Währungen → Aktien geraten unter Druck, weil künftige Gewinne stärker abgezinst werden und sichere Anleihen attraktiver werden. Der Markt reagiert auf die Abweichung vom Konsens, nicht auf den absoluten Wert.",
items:[
{t:"CPI / Core CPI",s:"Verbraucherpreise, monatlich (USA: BLS)",w:3,d:"hawk",m:"Preisveränderung eines Warenkorbs, den Haushalte kaufen. Core ohne Energie und Nahrungsmittel.",z:"Wichtigster Inflationsdatenpunkt für den Markt. Core zeigt den Trend besser, weil Energie stark schwankt. Großer Anteil: Wohnkosten (Shelter), die mit Verzögerung auf Marktmieten reagieren. Viele Trader schauen zusätzlich auf Supercore (Dienstleistungen ohne Wohnen), weil dieser Teil am stärksten von Löhnen abhängt.",l:"Über Konsens → hawkish. Die Fed kann nicht senken, solange die Inflation hartnäckig bleibt, also schiebt der Markt erwartete Zinssenkungen nach hinten oder preist sogar Erhöhungen ein. Das sieht man sofort in den Fed Funds Futures und in der 2-jährigen Rendite, die am direktesten an der Leitzinserwartung hängt. Unter Konsens → das Gegenteil, Senkungen rücken näher.",u:"USD: steigt bei höherem CPI, weil der Zinsvorsprung der USA gegenüber Euro, Yen und Co. größer wird und Anleger dafür Dollar kaufen. Aktien: fallen meist, weil höhere Zinsen künftige Gewinne stärker abzinsen und sichere Anleihen attraktiver machen. Tech und Small Caps trifft es am härtesten. Der CPI-Tag gehört regelmäßig zu den schwankungsreichsten Tagen im Monat für den S&P 500."},
{t:"PPI / Core PPI",s:"Erzeugerpreise, monatlich",w:2,d:"hawk",m:"Preise, die Produzenten für ihre Güter und Dienstleistungen erhalten.",z:"Frühindikator für den CPI, weil Kosten teils an Verbraucher weitergegeben werden. Einige Komponenten wie Flugpreise, Arztkosten und Portfoliomanagement-Gebühren fließen direkt in die PCE-Berechnung ein.",l:"Über Konsens → leicht hawkish. Steigende Erzeugerpreise deuten an, dass in den nächsten Monaten mehr Kostendruck bei den Verbrauchern ankommt. Stärker beachtet, wenn er nach dem CPI kommt, weil Ökonomen dann ihre PCE-Prognose anpassen, und PCE ist die Zahl, auf die die Fed schaut.",u:"USD: leicht fester bei hohem PPI, die Bewegung ist aber meist kleiner als beim CPI, weil der PPI nur ein Vorläufer ist. Aktien: zwei Effekte. Allgemein belasten höhere Zinserwartungen. Zusätzlich drücken hohe Erzeugerpreise auf die Margen von Unternehmen, die ihre Kosten nicht vollständig an Kunden weitergeben können."},
{t:"PCE / Core PCE",s:"Konsumausgaben-Deflator, monatlich (BEA)",w:3,d:"hawk",m:"Preisentwicklung aller Konsumausgaben, breiter gefasst als der CPI und mit wechselnden Gewichten.",z:"Das 2 %-Ziel der Fed bezieht sich auf PCE. Weil die Gewichte sich anpassen, wenn Haushalte auf günstigere Güter ausweichen, liegt PCE meist etwas unter dem CPI. Kommt nach CPI und PPI, deshalb ist die Überraschung oft kleiner.",l:"Über Ziel und steigend → Fed bleibt restriktiv. Für die Fed-Kommunikation die zentrale Zahl: Projektionen und Reden beziehen sich auf PCE. Weil CPI und PPI vorher erscheinen, können Ökonomen PCE schon recht genau schätzen. Die Marktreaktion fällt daher meist klein aus, außer die Schätzungen lagen daneben.",u:"USD und Aktien reagieren in dieselbe Richtung wie beim CPI (hohes PCE → USD ↑, Aktien ↓), aber meist schwächer, weil wenig Überraschung übrig ist. Wichtig wird PCE, wenn es die Erzählung bestätigt oder widerlegt, etwa ob die Inflation nachhaltig Richtung 2 % läuft."},
{t:"HICP (Eurozone)",s:"Harmonisierter Verbraucherpreisindex",w:3,d:"hawk",m:"Verbraucherpreise nach einheitlicher EU-Methodik. Flash-Schätzung am Monatsende.",z:"Grundlage für das 2 %-Ziel der EZB. Deutsche Länderdaten und die Zahlen aus Frankreich, Italien und Spanien kommen vorher und geben einen Vorgeschmack.",l:"Über Konsens → EZB eher restriktiv. Besonders beachtet werden die Kernrate und die Dienstleistungsinflation, weil diese stark von Löhnen getrieben ist und nur langsam fällt. Die EZB hat nur ein Mandat, die Preisstabilität, deshalb ist Inflation für sie noch zentraler als für die Fed.",u:"EUR: tendenziell fester, weil höhere EZB-Zinsen Euro-Anlagen attraktiver machen und die Zinsdifferenz zu den USA schrumpft. EUR/USD steigt also. Aktien: DAX und Euro Stoxx leiden unter höheren Zinsen und zusätzlich unter einem stärkeren Euro, weil der die Waren der vielen Exporteure im Ausland teurer macht. Banken können profitieren, weil ihre Zinsmarge steigt."},
{t:"Importpreise",s:"Preise importierter Güter, monatlich",w:1,d:"hawk",m:"Preisentwicklung von Gütern aus dem Ausland, stark von Wechselkurs und Rohstoffen getrieben.",z:"Kanal, über den eine schwache Währung oder teure Rohstoffe Inflation importieren.",l:"Meist geringe Marktreaktion. Hoher Anstieg → leichter Inflationsdruck, besonders wenn er auf eine Abwertung der eigenen Währung zurückgeht, weil das ein dauerhafterer Effekt ist als ein kurzer Ölpreissprung.",u:"Hier läuft der Zusammenhang auch umgekehrt: Ein schwacher Dollar macht Importe teurer und erhöht so die Inflation, was die Fed restriktiver machen kann. Ein starker Dollar wirkt dagegen wie eine kleine Zinserhöhung, weil er Importe verbilligt und die Inflation dämpft. Auf Aktien kaum direkte Wirkung."},
{t:"Inflationserwartungen",s:"z. B. UoM 1 Jahr und 5–10 Jahre",w:2,d:"hawk",m:"Wie viel Inflation Haushalte (Umfrage) oder Märkte (Breakevens) erwarten.",z:"Erwartungen beeinflussen Lohnforderungen und Preissetzung. Langfristige Erwartungen zeigen, ob die Zentralbank glaubwürdig ist. Breakevens sind die Differenz zwischen normalen und inflationsgeschützten Staatsanleihen (TIPS) und zeigen, welche Inflation der Anleihemarkt einpreist.",l:"Steigende langfristige Erwartungen → deutlich hawkish. Wenn Haushalte und Unternehmen glauben, dass die Inflation dauerhaft hoch bleibt, fordern sie höhere Löhne und erhöhen Preise vorsorglich. Dann verfestigt sich die Inflation, und die Zentralbank muss härter bremsen, um sie zu brechen. Die Fed spricht von verankerten Erwartungen, solange sie nahe 2 % bleiben.",u:"USD: steigt, wenn der Markt glaubt, dass die Fed mit höheren Zinsen reagiert. Glaubt der Markt das nicht, kann der Dollar sogar fallen, weil Inflation die Kaufkraft der Währung entwertet. Aktien: leiden unter der Aussicht auf höhere Zinsen. Zudem steigen lange Renditen, weil Anleger eine höhere Inflationsprämie verlangen, und das drückt besonders auf hoch bewertete Wachstumswerte."}
]},
{id:"arbeit",name:"Arbeitsmarkt",lead:"Die Fed hat ein duales Mandat: Preisstabilität und maximale Beschäftigung. Der Arbeitsmarkt ist deshalb fast so wichtig wie die Inflation.",chain:"Starker Arbeitsmarkt → steigende Löhne → mehr Konsum und Dienstleistungsinflation → Zinsen bleiben hoch → USD fester, Aktien unter Bewertungsdruck. Ein schwächelnder Arbeitsmarkt öffnet die Tür für Zinssenkungen, kann aber auch Rezessionsangst auslösen. Ob Aktien dann steigen oder fallen, hängt davon ab, welche Sorge im Markt gerade überwiegt.",
items:[
{t:"Non-Farm Payrolls",s:"Neue Stellen außerhalb der Landwirtschaft, erster Freitag",w:3,d:"hawk",m:"Monatliche Veränderung der Beschäftigtenzahl laut Unternehmensbefragung.",z:"Kommt zusammen mit Arbeitslosenquote und Löhnen. Revisionen der Vormonate können die Reaktion umdrehen.",l:"Über Konsens → hawkish: Die Wirtschaft braucht offenbar keine Hilfe durch niedrigere Zinsen, und mehr Jobs bedeuten mehr Einkommen, mehr Konsum und mehr Preisdruck. Deutlich darunter → Zinssenkungserwartungen steigen, weil die Fed ihr Beschäftigungsziel gefährdet sieht. Revisionen zählen mit: +200.000 bei einer Abwärtsrevision der Vormonate um 100.000 ist schwächer, als es aussieht.",u:"USD: steigt bei starkem NFP, oft deutlich, weil NFP einer der größten Datenpunkte für die Fed-Erwartungen ist. Aktien: hängt von der Phase ab. In einer Inflationsphase fallen Aktien bei starkem NFP, weil die Zinsen länger hoch bleiben. Fürchtet der Markt eine Rezession, steigen Aktien bei starkem NFP, weil die Gewinne sicherer werden. Ein sehr schwacher Wert kann Aktien trotz Zinshoffnung fallen lassen, wenn er nach Rezession aussieht."},
{t:"Arbeitslosenquote",s:"Anteil Arbeitsloser an Erwerbspersonen",w:3,d:"dove",m:"Ergebnis der Haushaltsbefragung, gleicher Release wie NFP.",z:"Direktes Maß für das Beschäftigungsmandat. Ein schneller Anstieg gilt als Rezessionssignal.",l:"Höher als erwartet → dovish. Die Richtung ist umgekehrt zu den meisten anderen Daten: Mehr Arbeitslose bedeuten weniger Lohndruck und weniger Konsum, also weniger Grund für hohe Zinsen. Beobachtet wird die Sahm-Regel: Liegt der 3-Monats-Schnitt 0,5 Prozentpunkte über dem Tief der letzten 12 Monate, war das historisch fast immer der Beginn einer Rezession.",u:"USD: fällt bei höherer Quote, weil Zinssenkungen wahrscheinlicher werden und der Zinsvorsprung schrumpft. Aktien: Ein kleiner Anstieg kann positiv wirken, weil die Fed dann senken kann. Ein sprunghafter Anstieg löst dagegen Rezessionsangst aus. Dann fallen Aktien trotz sinkender Renditen, weil die Gewinnerwartungen einbrechen, und Staatsanleihen steigen als sicherer Hafen."},
{t:"Average Hourly Earnings",s:"Durchschnittliche Stundenlöhne",w:2,d:"hawk",m:"Lohnwachstum pro Stunde, Monat und Jahr.",z:"Löhne treiben Dienstleistungspreise. Lohnwachstum deutlich über Produktivität plus 2 % gilt als inflationär.",l:"Über Konsens → hawkish. Löhne sind für Unternehmen Kosten, die sie über Preise weitergeben, und für Haushalte Einkommen, das sie ausgeben. Steigen Löhne dauerhaft schneller als die Produktivität, droht eine Lohn-Preis-Spirale. Grobe Faustregel: Lohnwachstum um 3 bis 3,5 % pro Jahr ist mit 2 % Inflation vereinbar.",u:"USD: fester bei hohem Lohnwachstum, weil die Fed länger restriktiv bleiben muss. Aktien: doppelt belastet. Höhere Zinserwartungen drücken die Bewertung, und höhere Lohnkosten drücken die Margen, besonders in personalintensiven Branchen wie Gastronomie, Handel und Dienstleistungen."},
{t:"Initial Jobless Claims",s:"Erstanträge auf Arbeitslosenhilfe, jeden Donnerstag",w:2,d:"dove",m:"Wie viele Menschen sich in der Woche neu arbeitslos melden.",z:"Höchste Frequenz aller Arbeitsmarktdaten. Einzelwochen sind verrauscht, der Trend (4-Wochen-Schnitt) zählt.",l:"Anhaltend steigend → dovish, der Arbeitsmarkt kühlt ab. Werte um 200.000 pro Woche gelten als sehr niedrig, ein Anstieg Richtung 300.000 deutet auf Entlassungswellen hin. Zusätzlich wichtig: Continuing Claims, also wie viele weiterhin Arbeitslosenhilfe beziehen. Steigen sie, finden Arbeitslose schwerer einen neuen Job.",u:"USD: reagiert meist nur bei deutlichen Ausreißern oder Trendwechseln, dann aber nach dem gleichen Muster: mehr Anträge → Zinssenkungen wahrscheinlicher → USD schwächer. Aktien: Kleine Ausschläge werden ignoriert. Ein klarer Aufwärtstrend wird als Frühwarnsignal für eine Rezession gelesen und kann Aktien belasten, obwohl die Renditen fallen."},
{t:"ADP Employment",s:"Private Beschäftigung, Mittwoch vor NFP",w:1,d:"hawk",m:"Beschäftigungsschätzung aus den Lohnabrechnungsdaten von ADP.",z:"Wird oft als NFP-Vorschau gehandelt, sagt NFP aber nur schwach voraus.",l:"Kurzfristige Reaktion möglich, die eigentliche Bewertung folgt mit NFP zwei Tage später. Weicht ADP stark vom Konsens ab, passen manche Trader ihre NFP-Erwartung an, aber Abweichungen von über 100.000 zwischen beiden Zahlen sind keine Seltenheit.",u:"USD und Aktien: kurze Bewegung in Richtung des Ergebnisses (starkes ADP → Renditen ↑, USD ↑), die bis zum NFP oft wieder verschwindet. Mehr Gewicht hat ADP, wenn offizielle Daten fehlen, etwa während eines Government Shutdowns."},
{t:"JOLTS Job Openings",s:"Offene Stellen und Kündigungen",w:2,d:"hawk",m:"Offene Stellen, Einstellungen und freiwillige Kündigungen (Quits).",z:"Viele offene Stellen pro Arbeitslosem bedeuten einen angespannten Markt. Eine hohe Quits-Rate deutet auf Lohndruck hin.",l:"Mehr offene Stellen als erwartet → leicht hawkish. Die Fed beobachtet das Verhältnis offene Stellen pro Arbeitslosem: 2022 lag es bei rund 2, der Arbeitsmarkt war extrem angespannt. Sinkt es Richtung 1, normalisiert sich die Lage, ohne dass gleich viele Menschen ihren Job verlieren. Die Quits-Rate zeigt, wie sicher sich Beschäftigte fühlen: Wer kündigt, rechnet mit einem besser bezahlten neuen Job.",u:"USD: leicht fester bei starkem JOLTS. Die Reaktion ist kleiner als bei NFP, weil die Daten einen Monat älter sind. Aktien: ähnlich wie bei NFP, abhängig davon, ob der Markt gerade Inflation oder Abschwung fürchtet. Sinkende offene Stellen bei stabiler Arbeitslosigkeit gelten als ideales Soft-Landing-Signal und werden von Aktien oft positiv aufgenommen."}
]},
{id:"wachstum",name:"Wachstum und Konsum",lead:"Diese Daten zeigen, wie viel Nachfrage in der Wirtschaft steckt. Zu viel Nachfrage heizt Preise an, zu wenig signalisiert Abschwung.",chain:"Starke Nachfrage (Y = C + I + G + NX) → Kapazitäten ausgelastet → Preisdruck → Zinsen bleiben hoch. Für Aktien ist das zweischneidig: Mehr Wachstum heißt mehr Umsatz und Gewinn, aber auch höhere Zinsen. Der USD profitiert meist, weil eine starke Wirtschaft höhere Zinsen und Kapitalzuflüsse anzieht. Schwaches Wachstum bei sinkender Inflation macht Senkungen wahrscheinlicher.",
items:[
{t:"BIP / GDP",s:"Quartalsweise, Advance, Second, Third",w:2,d:"hawk",m:"Gesamtwert aller produzierten Güter und Dienstleistungen, annualisiert.",z:"Die erste Schätzung (Advance) bewegt den Markt am stärksten. Enthält auch einen Preisindex.",l:"Über Konsens → hawkish, vor allem bei gleichzeitig hoher Inflation. Eine Wirtschaft, die deutlich über ihrem Potenzialwachstum (in den USA rund 2 %) wächst, erzeugt Preisdruck, weil Kapazitäten und Arbeitskräfte knapp werden. Wichtig sind die Details: Wachstum aus Lageraufbau oder Nettoexporten ist weniger nachhaltig als Wachstum aus Konsum und Investitionen (Final Sales to Private Domestic Purchasers).",u:"USD: steigt bei starkem BIP, weil höhere Zinsen erwartet werden und eine starke Wirtschaft Investitionskapital anzieht. Aktien: Wachstum bedeutet höhere Gewinne, deshalb ist ein starkes BIP oft neutral bis positiv. Negativ wird es, wenn der enthaltene Preisindex ebenfalls hoch ausfällt und der Markt eine restriktivere Fed fürchtet."},
{t:"Retail Sales",s:"Einzelhandelsumsätze, monatlich",w:2,d:"hawk",m:"Umsätze im Einzelhandel, nominal. Control Group ohne Autos, Benzin, Baumaterial und Gastronomie.",z:"Konsum macht rund zwei Drittel des US-BIP aus. Die Control Group fließt direkt in die BIP-Berechnung ein.",l:"Über Konsens → hawkish, die Nachfrage bleibt robust. Wenn Haushalte trotz hoher Zinsen weiter kaufen, wirkt die Geldpolitik nicht genug, und Händler können Preise leichter erhöhen. Achtung: Die Zahl ist nominal. Steigen die Umsätze nur wegen höherer Preise, ist das Inflation, kein reales Wachstum.",u:"USD: fester bei starken Umsätzen. Aktien: Händler und Konsumwerte wie Amazon oder Walmart profitieren direkt von höheren Umsätzen, während der Gesamtmarkt eher auf die Zinsseite schaut. Bei schwachen Zahlen fallen Konsumwerte, und der Markt preist mehr Senkungen ein."},
{t:"Industrieproduktion",s:"Output von Industrie, Bergbau, Versorgern",w:1,d:"hawk",m:"Mengenmäßige Produktion, mit Kapazitätsauslastung.",z:"Hohe Kapazitätsauslastung deutet auf Preisdruck hin. In Deutschland wichtiger als in den USA.",l:"Meist geringe Wirkung, außer bei großen Überraschungen. Die Industrie ist in den USA nur ein kleiner Teil der Wirtschaft (rund 10 %). Eine Kapazitätsauslastung über etwa 80 % gilt als Zeichen, dass Engpässe und damit Preisdruck entstehen.",u:"USD: kaum Reaktion auf US-Daten. In Deutschland stärker beachtet, wo die Industrie ein viel größerer Teil der Wirtschaft ist: Schwache Produktion belastet EUR und DAX. Aktien: Zyklische Industriewerte wie Maschinenbau, Chemie und Rohstoffe reagieren stärker als der Gesamtmarkt."},
{t:"Durable Goods Orders",s:"Aufträge für langlebige Güter",w:1,d:"hawk",m:"Neue Aufträge für Güter mit über drei Jahren Lebensdauer.",z:"Headline schwankt stark durch Flugzeugbestellungen. Core Capital Goods (ohne Rüstung und Flugzeuge) ist ein Proxy für Unternehmensinvestitionen.",l:"Starke Core-Werte → leicht hawkish, Investitionen halten trotz Zinsen. Unternehmensinvestitionen reagieren normalerweise empfindlich auf Zinsen, weil Maschinen und Anlagen oft kreditfinanziert werden. Bleiben sie stark, wirkt die Geldpolitik langsamer als gedacht.",u:"USD: kleine Reaktion, nur die Core-Zahl wird ernst genommen. Aktien: Industrie- und Ausrüsterwerte profitieren von starken Aufträgen, weil heutige Aufträge die Umsätze der nächsten Quartale sind. Ein schwacher Trend deutet darauf hin, dass Unternehmen wegen unsicherer Aussichten oder hoher Zinsen Investitionen verschieben."},
{t:"Factory Orders",s:"Auftragseingänge der Industrie",w:1,d:"neutral",m:"Alle Industrieaufträge, langlebig und nicht langlebig.",z:"Ein großer Teil ist durch Durable Goods schon bekannt, daher wenig neue Information.",l:"Kaum Wirkung auf Zinserwartungen. Die langlebigen Güter sind bereits aus dem Durable-Goods-Bericht bekannt. Neu sind nur die nicht langlebigen Güter, und die schwanken stark mit dem Ölpreis.",u:"USD und Aktien: in der Regel keine messbare Reaktion. Der Bericht dient eher dazu, das Gesamtbild der Industrie zu bestätigen."}
]},
{id:"stimmung",name:"Stimmung und Umfragen",lead:"Umfragen kommen früh und zeigen Wendepunkte, bevor sie in harten Daten wie Produktion oder BIP sichtbar werden.",chain:"Bessere Stimmung → mehr Aufträge und Einstellungen in den Folgemonaten → mehr Nachfrage. Preis-Unterindizes geben zusätzlich einen frühen Blick auf die Inflation. Weil Umfragen Wendepunkte früh zeigen, reagieren Aktien oft stärker auf sie als auf harte Daten: Der Aktienmarkt handelt die Zukunft, und Einkaufsmanagerindizes sind der früheste Blick darauf.",
items:[
{t:"ISM Manufacturing PMI",s:"Einkaufsmanagerindex Industrie, erster Werktag",w:2,d:"hawk",m:"Diffusionsindex aus Befragung von Einkaufsmanagern. Über 50 Expansion, unter 50 Kontraktion.",z:"Unterindizes wie Prices Paid und Employment geben Hinweise auf Inflation und Arbeitsmarkt. New Orders minus Inventories gilt als Frühindikator für die Produktion der nächsten Monate.",l:"Über Konsens → leicht hawkish. Steigende Prices Paid sind ein Inflationswarnsignal, weil Unternehmen höhere Einkaufspreise meist mit Verzögerung weitergeben. Als Diffusionsindex zeigt der ISM, wie viele Firmen eine Verbesserung melden, nicht wie groß sie ist.",u:"USD: fester bei starkem ISM. Aktien: Der ISM Manufacturing läuft historisch eng mit dem Gewinnwachstum im S&P 500, weil er die Richtung des Konjunkturzyklus anzeigt. Ein Wechsel über oder unter 50 wird als Zyklussignal gelesen. Zyklische Sektoren und Rohstoffwerte reagieren stärker als defensive wie Gesundheit oder Versorger."},
{t:"ISM Services PMI",s:"Einkaufsmanagerindex Dienstleistungen",w:2,d:"hawk",m:"Gleiche Methodik für den Dienstleistungssektor.",z:"Dienstleistungen sind der größte Teil der US-Wirtschaft, und Dienstleistungsinflation ist besonders hartnäckig.",l:"Starker Wert und hohe Preiskomponente → hawkish. Dienstleistungsinflation ist für die Fed das größte Problem, weil sie vor allem von Löhnen abhängt und nicht wie Warenpreise durch entspannte Lieferketten schnell fällt. Fällt der Index unter 50, ist das ein ernstes Abschwungsignal, weil Dienstleistungen selten schrumpfen.",u:"USD: reagiert oft stärker als auf den Industrie-ISM, weil Dienstleistungen rund 70 bis 80 % der US-Wirtschaft ausmachen. Aktien: In Inflationsphasen fallen Aktien bei hohen Prices Paid. In Phasen mit Rezessionssorgen beruhigt ein solider Wert über 50 den Markt."},
{t:"Flash PMIs (S&P Global)",s:"Vorläufige PMIs, um den 23. des Monats",w:2,d:"hawk",m:"Erste Einkaufsmanager-Daten zum laufenden Monat, für USA, Eurozone, UK und mehr.",z:"Die frühesten Daten des Monats überhaupt. Für EUR-Paare oft einer der wichtigsten Termine.",l:"Über Konsens → leicht hawkish für die jeweilige Zentralbank. Für die EZB besonders wichtig, weil es in der Eurozone wenige zeitnahe harte Daten gibt. Die Preiskomponenten (Input und Output Prices) liefern frühe Hinweise auf die Inflation im Dienstleistungssektor.",u:"Währung: Eurozonen-PMIs bewegen EUR/USD oft deutlich, weil sie die Erwartungen an die EZB verschieben und zeigen, ob Europa stärker oder schwächer wächst als die USA. Aktien: Ein schwacher Euro-PMI belastet zyklische Werte im DAX. Ein überraschend starker stützt sie meist trotz EZB-Sorgen, weil Wachstum für Europas Industrie wichtiger ist als ein paar Basispunkte Zins."},
{t:"ifo / ZEW",s:"Deutsche Stimmungsindikatoren",w:1,d:"hawk",m:"ifo befragt Unternehmen zu Lage und Erwartungen. ZEW befragt Finanzanalysten zu ihren Erwartungen.",z:"Frühindikatoren für Deutschland und damit die Eurozone. ZEW kommt früher im Monat.",l:"Wirkung auf die EZB gering, weil sie nur Deutschland abbilden und keine Preisdaten enthalten. Der ifo-Geschäftsklimaindex gilt als guter Frühindikator für die deutsche Industrie. Beim ZEW lohnt der Blick auf das Verhältnis von Lage und Erwartungen: Steigen die Erwartungen bei schlechter Lage, deutet das auf eine Erholung hin.",u:"EUR: bewegt sich bei großen Überraschungen, weil Deutschland die größte Volkswirtschaft der Eurozone ist. DAX: reagiert oft direkt, weil viele DAX-Konzerne zyklisch und exportabhängig sind. Allerdings verdienen DAX-Konzerne einen großen Teil ihres Geldes im Ausland, deshalb ist der Zusammenhang zur deutschen Konjunktur schwächer, als man denkt."},
{t:"UoM Consumer Sentiment",s:"Verbraucherstimmung Uni Michigan",w:1,d:"hawk",m:"Befragung von Haushalten zu Finanzlage und Wirtschaftsaussichten.",z:"Enthält die Inflationserwartungen der Haushalte, die oft wichtiger sind als die Stimmung selbst.",l:"Stimmung allein bewegt wenig. Steigende Inflationserwartungen → hawkish, besonders die 5-bis-10-Jahres-Erwartung, weil sie zeigt, ob die Haushalte der Fed vertrauen. Die Fed hat schon auf diese Zahl reagiert: Im Juni 2022 trug ein Sprung der langfristigen Erwartungen dazu bei, dass sie um 75 statt 50 Basispunkte erhöhte.",u:"USD und Renditen reagieren vor allem auf die Inflationserwartungen: höhere Erwartungen → Renditen ↑, USD ↑. Aktien: Schlechte Verbraucherstimmung allein ist oft kein Problem, weil Haushalte trotzdem weiter konsumieren. Erst wenn auch Retail Sales schwächeln, nimmt der Markt die schlechte Stimmung ernst."},
{t:"CB Consumer Confidence",s:"Conference Board Verbrauchervertrauen",w:1,d:"hawk",m:"Haushaltsbefragung mit Fokus auf Arbeitsmarktwahrnehmung.",z:"Das Labor Differential (Jobs reichlich minus schwer zu finden) korreliert mit der Arbeitslosenquote.",l:"Geringe direkte Wirkung auf Zinserwartungen. Interessanter als die Gesamtzahl ist das Labor Differential: Sinkt es, merken Haushalte, dass Jobs schwerer zu finden sind, oft bevor das in der Arbeitslosenquote sichtbar wird.",u:"USD und Aktien: kleine Bewegungen. Konsumwerte reagieren am ehesten, weil das Vertrauen die Ausgabebereitschaft der kommenden Monate anzeigt."}
]},
{id:"immo",name:"Immobilien und Außenhandel",lead:"Immobilien reagieren als einer der ersten Sektoren auf Zinsänderungen. Außenhandelsdaten wirken eher indirekt über BIP und Währung.",chain:"Höhere Zinsen → teurere Hypotheken → weniger Baubeginne und Verkäufe. Diese Daten zeigen vor allem, ob die Geldpolitik wirkt, statt sie direkt zu treiben. Für Aktien sind sie trotzdem wichtig, weil am Immobilienmarkt viele Branchen hängen: Bauträger, Baumaterial, Möbel, Makler, Banken. Außenhandelsdaten wirken vor allem langfristig auf die Währung.",
items:[
{t:"Housing Starts",s:"Baubeginne neuer Wohneinheiten",w:1,d:"hawk",m:"Wie viele neue Wohnbauten im Monat begonnen wurden, annualisiert.",z:"Sehr zinssensitiv. Wohnungsbau ist ein früher Konjunkturindikator.",l:"Geringe direkte Wirkung. Ein starker Rückgang zeigt, dass die Straffung greift. Der Wohnungsbau reagiert früh, weil fast jeder Hauskauf kreditfinanziert ist. In den USA folgt der 30-jährige Hypothekenzins der 10-jährigen Rendite, nicht direkt dem Leitzins.",u:"USD: kaum Reaktion. Aktien: Homebuilder wie D.R. Horton oder Lennar und Baustoffhersteller reagieren deutlich. Oft steigen Homebuilder-Aktien schon, wenn Zinssenkungen eingepreist werden, lange bevor sich die Baubeginne tatsächlich erholen, weil der Aktienmarkt vorausschaut."},
{t:"Building Permits",s:"Baugenehmigungen",w:1,d:"hawk",m:"Genehmigte Wohneinheiten, vor dem eigentlichen Baubeginn.",z:"Läuft den Housing Starts voraus, deshalb der bessere Frühindikator.",l:"Geringe direkte Wirkung auf den Leitzins. Weil Genehmigungen dem Bau um einige Monate vorauslaufen, zeigen sie früh, ob der Wohnungsbau wieder anzieht oder weiter schrumpft.",u:"USD: keine nennenswerte Reaktion. Aktien: wie bei Housing Starts vor allem Homebuilder und Baustoffwerte. Mehr Genehmigungen bedeuten auf längere Sicht auch mehr Wohnraum, was die Mietinflation und damit den Shelter-Anteil im CPI dämpfen kann."},
{t:"Existing Home Sales",s:"Verkäufe bestehender Häuser",w:1,d:"neutral",m:"Abgeschlossene Verkäufe von Bestandsimmobilien.",z:"Größter Teil des Immobilienmarkts. Hohe Zinsen bremsen Verkäufe, weil Eigentümer günstige alte Kredite nicht aufgeben wollen.",l:"Kaum Wirkung, eher Bestätigung der Transmission. Dahinter steckt der Lock-in-Effekt: Wer sich eine Hypothek zu 3 % gesichert hat, verkauft ungern, wenn ein neuer Kredit 7 % kostet. Das hält das Angebot knapp und die Preise trotz hoher Zinsen hoch.",u:"USD: keine Reaktion. Aktien: Makler, Hypothekenbanken und Immobilienplattformen hängen am Transaktionsvolumen. Wenige Verkäufe bedeuten weniger Provisionen und weniger Kreditgeschäft."},
{t:"New Home Sales",s:"Verkäufe von Neubauten",w:1,d:"neutral",m:"Verkaufte neue Einfamilienhäuser, gezählt bei Vertragsabschluss.",z:"Volatil und stark revidiert. Bauträger können mit Zinsvergünstigungen gegensteuern.",l:"Kaum Wirkung auf Zinserwartungen. Weil Bestandsimmobilien wegen des Lock-in-Effekts knapp sind, weichen viele Käufer auf Neubauten aus. Bauträger kaufen den Kunden zudem oft den Zins herunter (Mortgage Buydown) und stützen so den Absatz.",u:"USD: keine Reaktion. Aktien: Homebuilder reagieren, die Zahl ist aber so volatil, dass der Trend über mehrere Monate wichtiger ist als ein einzelner Wert."},
{t:"Handelsbilanz",s:"Exporte minus Importe, monatlich",w:1,d:"neutral",m:"Saldo des Waren- und Dienstleistungshandels.",z:"Nettoexporte sind Teil des BIP. Kann BIP-Schätzungen verändern und wirkt auf die Währung.",l:"Sehr geringe direkte Wirkung auf den Leitzins. Ein überraschend großes Defizit kann aber die BIP-Schätzung für das Quartal senken, weil Nettoexporte negativ ins BIP eingehen.",u:"Währung: Ein Land mit Exportüberschuss erhält laufend Fremdwährung, die in die eigene Währung getauscht wird. Das stützt die Währung langfristig. Kurzfristig dominieren aber die Zinsdifferenzen. Aktien: kaum direkte Reaktion. Bei Themen wie Zöllen wird die Handelsbilanz politisch wichtig und kann dann exportabhängige Branchen bewegen."},
{t:"Leistungsbilanz",s:"Quartalsweise",w:1,d:"neutral",m:"Handelsbilanz plus Einkommen und Transfers mit dem Ausland.",z:"Langfristig relevant für Währungen, weil Defizite durch Kapitalzuflüsse finanziert werden müssen.",l:"Praktisch kein kurzfristiger Einfluss auf den Leitzins.",u:"Währung: Ein Land mit dauerhaftem Leistungsbilanzdefizit wie die USA ist auf ausländisches Kapital angewiesen. Solange Investoren gern US-Anlagen kaufen, ist das kein Problem. Lässt das Interesse nach, muss die Währung abwerten oder die Zinsen müssen steigen, um Kapital anzuziehen. Für Aktien ist das ein langfristiges Thema, kein Handelssignal."}
]},
{id:"zb",name:"Zentralbank",lead:"Hier entsteht der Leitzins tatsächlich. Alle anderen Daten werden durch die Brille der Zentralbank gelesen.",chain:"Daten → Erwartungen der Notenbanker → Kommunikation → Marktpreise. Bewegung entsteht, wenn die Zentralbank anders handelt oder spricht, als Fed Funds Futures es eingepreist haben. An Zinstagen bewegen sich Renditen, USD und Aktien oft am stärksten, weil hier die Erwartung direkt korrigiert wird statt indirekt über Daten.",
items:[
{t:"Zinsentscheid",s:"Fed acht Mal pro Jahr, EZB ähnlich",w:3,d:"neutral",m:"Festlegung des Leitzinses, bei der Fed das Zielband der Fed Funds Rate.",z:"Meist vorher weitgehend eingepreist. Die Überraschung steckt oft in Statement und Ausblick.",l:"Höher als eingepreist → hawkish, niedriger → dovish. Meist signalisiert die Fed den Schritt vorher über Reden, weil sie Überraschungen vermeiden will. Echte Überraschungen beim Entscheid selbst sind daher selten und lösen dann sehr große Bewegungen aus.",u:"USD: steigt bei einer hawkishen Überraschung, weil der Zinsvorsprung größer wird. Aktien: fallen bei einer hawkishen Überraschung (höhere Abzinsung, attraktivere Anleihen). Achtung: Auch eine überraschend große Senkung kann Aktien fallen lassen, wenn der Markt daraus liest, dass die Fed sich mehr Sorgen um die Wirtschaft macht als bekannt."},
{t:"Statement und Pressekonferenz",s:"Direkt nach dem Entscheid",w:3,d:"neutral",m:"Schriftliche Begründung und Fragen an Fed-Chair bzw. EZB-Präsidentin.",z:"Kleine Formulierungsänderungen im Statement werden Wort für Wort verglichen. In der PK entstehen oft die größten Bewegungen.",l:"Signal für die nächsten Schritte, die Forward Guidance. Formulierungen wie „weitere Straffung angemessen“ oder „datenabhängig“ werden genau gelesen, weil sie zeigen, ob die nächste Sitzung offen ist. In der PK reagieren die Märkte live auf einzelne Antworten.",u:"USD und Aktien schwanken während der Pressekonferenz oft mehrfach hin und her. Typisch: Der Zinsentscheid war erwartet, dann deutet ein Satz in der PK auf weniger Senkungen hin, Renditen und USD steigen, Aktien drehen ins Minus. Die Schlussbewegung des Tages zeigt, welche Interpretation sich durchsetzt."},
{t:"Projektionen / Dot Plot",s:"Fed, vier Mal pro Jahr",w:3,d:"neutral",m:"Prognosen zu Wachstum, Inflation, Arbeitslosigkeit und der Zinspfad jedes FOMC-Mitglieds als Punkt.",z:"Zeigt, wie viele Senkungen oder Erhöhungen die Mitglieder erwarten, im Vergleich zur Markterwartung.",l:"Mehr Erhöhungen oder weniger Senkungen als eingepreist → hawkish. Der Median der Punkte wird mit den Fed Funds Futures verglichen. Liegt er über dem Marktpfad, muss sich der Markt anpassen, oder er glaubt der Fed nicht. Auch die langfristigen Punkte (neutraler Zins) zählen: Steigen sie, erwartet die Fed dauerhaft höhere Zinsen.",u:"USD: steigt, wenn der Dot Plot weniger Senkungen zeigt als eingepreist. Aktien: Ein höherer Zinspfad belastet die Bewertung, besonders bei Wachstumswerten. Ein steigender neutraler Zins ist für Aktien langfristig wichtiger als eine einzelne Sitzung, weil er die Abzinsung aller künftigen Gewinne betrifft."},
{t:"FOMC-/EZB-Protokolle",s:"Minutes, etwa drei Wochen nach der Sitzung",w:2,d:"neutral",m:"Ausführliche Zusammenfassung der Diskussion in der Sitzung.",z:"Zeigt die Bandbreite der Meinungen und ob eine Mehrheit zu einer Richtung tendiert.",l:"Meist moderate Wirkung, außer sie widersprechen dem Ton der Pressekonferenz. Klang die PK dovish, zeigen die Protokolle aber, dass viele Mitglieder weitere Erhöhungen wollten, korrigiert der Markt nach.",u:"USD und Aktien reagieren nur, wenn die Protokolle neue Informationen enthalten, etwa Diskussionen über die Bilanzverkürzung (Quantitative Tightening) oder breite Uneinigkeit. Mehr Liquiditätsentzug durch QT ist für Aktien eher negativ, weil weniger Geld im System nach Anlagen sucht."},
{t:"Reden der Notenbanker",s:"Laufend, besonders Chair und Präsidentin",w:2,d:"neutral",m:"Auftritte einzelner Mitglieder zwischen den Sitzungen.",z:"Werden genutzt, um Erwartungen vorab zu steuern. Gewicht hängt davon ab, wer spricht und ob die Person stimmberechtigt ist.",l:"Hawkishe Aussagen → Renditen steigen, dovishe → fallen. Vor jeder Sitzung gilt eine Blackout-Periode von rund zehn Tagen, in der Fed-Mitglieder nicht über Geldpolitik sprechen. Die letzten Reden davor werden deshalb als Signal für die Sitzung gelesen. Jackson Hole im August ist das bekannteste Forum für große Ankündigungen.",u:"USD: reagiert vor allem auf Chair, Vize und den Präsidenten der New York Fed, weil sie den Konsens im FOMC repräsentieren. Aktien: Eine einzelne hawkishe Rede kann eine Rally stoppen, besonders vom Chair. Bekanntes Beispiel: Powell in Jackson Hole im August 2022, danach fiel der S&P 500 an einem Tag um über 3 %."}
]}

  if(s==null)return '<span class="badge">'+n+' Fragen</span>';
  const pass=s/n>=PASS;
  return '<span class="badge '+(pass?"pass":"fail")+'">'+s+'/'+n+'</span>';
}
function renderNav(){
  const nav=document.getElementById("nav");
  nav.innerHTML=DATA.map(c=>'<button class="navbtn" data-id="'+c.id+'" aria-current="'+(c.id===current)+'"><span class="nm">'+esc(c.name)+'</span>'+badgeFor(c.id)+'</button>').join("");
  nav.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click",()=>{current=b.dataset.id;quizState=null;render();main.focus({preventScroll:true});window.scrollTo({top:0})}));
  const passed=DATA.filter(c=>scores[c.id]!=null&&scores[c.id]/QUIZ[c.id].length>=PASS).length;
  document.getElementById("overallText").textContent=passed+" von "+DATA.length+" Tests bestanden";
  document.getElementById("overallBar").style.width=(passed/DATA.length*100)+"%";
}
function dirLabel(d){
  if(d==="hawk")return '<span class="dir hawk">Höher als erwartet → Zinsen eher ↑</span>';
  if(d==="dove")return '<span class="dir dove">Höher als erwartet → Zinsen eher ↓</span>';
  return '<span class="dir neutral">Wirkung je nach Inhalt</span>';
}
function weight(w){
  let s='<span class="weight" aria-label="Einfluss auf den Leitzins: '+w+' von 3">';
  for(let i=1;i<=3;i++)s+='<i class="'+(i<=w?"on":"")+'"></i>';
  return s+'</span>';
}
function renderCategory(){
  const c=DATA.find(x=>x.id===current);
  const idx=DATA.indexOf(c);
  const lb=c.labels||LABELS;
  const rows=it=>["m","z","l","u"].map((k,j)=>it[k]?'<dt>'+lb[j]+'</dt><dd>'+esc(it[k])+'</dd>':'').join("");
  main.innerHTML='<div class="cat-head"><h2>'+esc(c.name)+'</h2><p class="lead">'+esc(c.lead)+'</p></div>'+
  '<div class="chain"><h3>'+esc(c.chainTitle||"Der Weg zum Leitzins")+'</h3><p>'+esc(c.chain)+'</p></div>'+
  '<div class="list">'+c.items.map(it=>'<details class="ind"><summary><span class="t">'+esc(it.t)+'</span><span class="s">'+esc(it.s)+'</span>'+(it.d?'<span class="lever">'+dirLabel(it.d)+weight(it.w)+'</span>':'')+'</summary><div class="body"><dl>'+rows(it)+'</dl></div></details>').join("")+'</div>'+
  (c.extra||'')+
  (c.items.some(it=>it.w)?'<p class="legend"><span>Balken = typischer Einfluss auf die Zinserwartungen (1 bis 3)</span></p>':'')+
  '<div class="cta"><p>'+(idx+1)+' von '+DATA.length+'. Wenn du alle Indikatoren durchgegangen bist, prüf dein Wissen mit '+QUIZ[c.id].length+' Fragen. Ab 80 % gilt der Test als bestanden.</p><button class="btn" id="startQuiz">Test starten</button></div>';
  document.getElementById("startQuiz").addEventListener("click",()=>{quizState={i:0,answers:[]};render();window.scrollTo({top:0})});
}
function renderQuiz(){
  const c=DATA.find(x=>x.id===current);
  const qs=QUIZ[current];
  const st=quizState;
  if(st.i>=qs.length)return renderResult();
  const q=qs[st.i];
  const answered=st.answers.length>st.i;
  const pick=answered?st.answers[st.i]:null;
  main.innerHTML='<div class="quiz"><div class="qmeta"><span>Test: '+esc(c.name)+'</span><span>Frage '+(st.i+1)+' von '+qs.length+'</span></div><div class="bar"><span style="width:'+(st.i/qs.length*100)+'%"></span></div>'+
  '<p class="qtext">'+esc(q.q)+'</p><div class="opts" role="group" aria-label="Antworten">'+
  q.o.map((o,k)=>{let cls="opt";if(answered){if(k===q.a)cls+=" right";else if(k===pick)cls+=" wrong"}return '<button class="'+cls+'" data-k="'+k+'"'+(answered?" disabled":"")+'>'+esc(o)+'</button>'}).join("")+'</div>'+
  (answered?'<div class="explain" role="status"><strong class="'+(pick===q.a?"ok":"no")+'">'+(pick===q.a?"Richtig.":"Nicht ganz.")+'</strong>'+esc(q.e)+'</div><div class="qnav"><button class="btn" id="next">'+(st.i+1<qs.length?"Nächste Frage":"Ergebnis anzeigen")+'</button></div>':'<div class="qnav"><button class="btn ghost" id="cancel">Test abbrechen</button></div>')+'</div>';
  main.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{st.answers[st.i]=Number(b.dataset.k);render();const n=document.getElementById("next");if(n)n.focus({preventScroll:true})}));
  const n=document.getElementById("next");if(n)n.addEventListener("click",()=>{st.i++;render()});
  const x=document.getElementById("cancel");if(x)x.addEventListener("click",()=>{quizState=null;render()});
}
function renderResult(){
  const c=DATA.find(x=>x.id===current);
  const qs=QUIZ[current];
  const right=quizState.answers.filter((a,k)=>a===qs[k].a).length;
  if(!quizState.saved){scores[current]=Math.max(right,scores[current]??0);quizState.saved=true;save();renderNav()}
  const pass=right/qs.length>=PASS;
  const idx=DATA.findIndex(x=>x.id===current);
  const nextCat=DATA[idx+1];
  main.innerHTML='<div class="quiz result"><h2>'+(pass?"Bestanden":"Noch nicht bestanden")+'</h2><div class="score">'+right+'/'+qs.length+'</div><p style="color:var(--muted);margin:0">'+(pass?"Du hast die Kategorie "+esc(c.name)+" verstanden.":"Schau dir die markierten Fragen an und geh die Indikatoren noch einmal durch.")+'</p>'+
  '<div class="review">'+qs.map((q,k)=>{const ok=quizState.answers[k]===q.a;return '<div class="'+(ok?"hit":"miss")+'">'+esc(q.q)+(ok?"":'<br><span style="color:var(--muted)">Richtig: '+esc(q.o[q.a])+'</span>')+'</div>'}).join("")+'</div>'+
  '<div class="qnav" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn ghost" id="again">Test wiederholen</button><button class="btn ghost" id="back">Zurück zu den Indikatoren</button>'+(nextCat?'<button class="btn" id="nextCat">Weiter zu '+esc(nextCat.name)+'</button>':'')+'</div></div>';
  document.getElementById("again").addEventListener("click",()=>{quizState={i:0,answers:[]};render()});
  document.getElementById("back").addEventListener("click",()=>{quizState=null;render()});
  const nc=document.getElementById("nextCat");if(nc)nc.addEventListener("click",()=>{current=nextCat.id;quizState=null;render();window.scrollTo({top:0})});
}
function render(){renderNav();if(quizState)renderQuiz();else renderCategory()}
render();
</script>
</body>
</html>
